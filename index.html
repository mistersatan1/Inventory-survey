<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6b45">
<title>재고조사</title>
<style>
:root{
  --bg:#f4f3ec; --card:#ffffff; --line:#e3e1d6; --line-2:#efede5; --ink:#1e2a22; --muted:#677066; --faint:#9aa198;
  --brand:#2f6b45; --brand-dark:#235236; --brand-2:#e6efe6; --brand-3:#f2f7f1;
  --minus:#c62f22; --minus-bg:#fdecea; --plus:#1f5fbf; --plus-bg:#e8f0fc; --ok:#1d7a43; --ok-bg:#e5f3ea;
  --warn:#8a5a00; --warn-bg:#fff4d6; --common:#6b4fa3; --common-bg:#efe9f8;
  --radius:14px; --radius-sm:10px; --tab-h:64px; --top-h:56px;
  --shadow:0 1px 2px rgba(30,42,34,.05),0 2px 8px rgba(30,42,34,.04);
  color-scheme: light;
}
body[data-shop="exp"]{ --brand:#c0570f; --brand-dark:#9a440a; --brand-2:#fbe8d8; --brand-3:#fdf4ec; }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Segoe UI",sans-serif;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num,td.n,.n{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;height:var(--top-h);display:flex;align-items:center;gap:10px;padding:0 12px;padding-top:env(safe-area-inset-top);background:var(--brand);color:#fff;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.shop-switch{position:relative}
.shop-btn{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;border:1.5px solid rgba(255,255,255,.55);border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:16px;white-space:nowrap}
.shop-btn:hover{background:rgba(255,255,255,.22)}
.shop-menu{position:absolute;left:0;top:calc(100% + 6px);min-width:220px;background:#fff;color:var(--ink);border-radius:var(--radius);box-shadow:0 8px 28px rgba(0,0,0,.18);padding:6px;z-index:40}
.shop-opt{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:8px 12px;border:0;border-radius:10px;background:none;text-align:left;font-weight:600;font-size:16px}
.shop-opt:hover{background:var(--line-2)}
.shop-opt .dot{width:14px;height:14px;border-radius:50%}
.shop-opt[aria-current="true"]{background:var(--brand-2)}
.shop-opt small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.top-title{flex:1;min-width:0;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-date{font-size:13px;opacity:.9;white-space:nowrap}

.notice{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;background:var(--warn-bg);color:var(--warn);font-size:14px;border-bottom:1px solid #f0e2b8}
.notice .btn{min-height:36px;padding:0 12px;font-size:14px}
.notice .x{margin-left:auto;background:none;border:0;color:var(--warn);min-width:36px;min-height:36px;font-size:18px}

/* ---------- layout & nav ---------- */
.layout{display:block}
main{padding:14px 14px calc(var(--tab-h) + 24px + env(safe-area-inset-bottom));max-width:1180px;margin:0 auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(6,1fr);height:calc(var(--tab-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line)}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600;min-width:0;letter-spacing:-.3px}
.nav a svg{width:22px;height:22px}
.nav a[aria-current="page"]{color:var(--brand)}
.nav a[aria-current="page"] svg{stroke-width:2.4}
.nav .nav-label{white-space:nowrap}
@media (min-width:900px){
  .layout{display:grid;grid-template-columns:220px 1fr;align-items:start}
  .nav{position:sticky;top:var(--top-h);height:calc(100vh - var(--top-h));display:flex;flex-direction:column;gap:4px;padding:16px 12px;border-top:0;border-right:1px solid var(--line);background:#fbfaf6}
  .nav a{flex-direction:row;justify-content:flex-start;gap:12px;min-height:46px;padding:0 14px;border-radius:12px;font-size:15px}
  .nav a:hover{background:var(--line-2)}
  .nav a[aria-current="page"]{background:var(--brand-2);color:var(--brand-dark)}
  main{padding:22px 28px 60px}
  .top-title{font-size:17px}
}

/* ---------- common components ---------- */
h1.page-h{font-size:21px;margin:2px 0 4px;letter-spacing:-.4px}
.page-sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px}
.card + .card{margin-top:12px}
.card h2{font-size:16px;margin:0 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:15px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:#cfccbf;background:#fafaf6}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
.btn.danger{color:var(--minus);border-color:#efc4bf}
.btn.danger.solid{background:var(--minus);border-color:var(--minus);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-flex;align-items:center;padding:1px 7px;border-radius:999px;font-size:11.5px;font-weight:700;line-height:18px;white-space:nowrap;vertical-align:middle}
.badge.common{background:var(--common-bg);color:var(--common)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.low{background:var(--minus-bg);color:var(--minus)}
.badge.none{background:#ececea;color:#555}
.badge.lock{background:var(--brand-2);color:var(--brand-dark)}
.badge.muted{background:var(--line-2);color:var(--muted)}
.minus{color:var(--minus);font-weight:700}
.plus{color:var(--plus);font-weight:700}
.match{color:var(--ok);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.field-input,input.inp,select.inp,textarea.inp{width:100%;min-height:44px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
textarea.inp{min-height:120px;resize:vertical;font-size:15px}
input.inp:focus,select.inp:focus,textarea.inp:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-2)}
input.bad{border-color:var(--minus)!important;background:var(--minus-bg)}
input:disabled,select:disabled{background:#f3f2ee;color:#777}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld > span,.fld-label{font-size:13px;font-weight:700;color:var(--muted)}
.fld .err{color:var(--minus);font-size:13px;min-height:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.seg button{flex:1;min-height:42px;border:0;background:none;font-weight:700;color:var(--muted)}
.seg button + button{border-left:1.5px solid var(--line)}
.seg button.on{background:var(--brand);color:#fff}
.seg[data-seg="type"] button.on[data-v="in"]{background:var(--plus)}
.seg[data-seg="type"] button.on[data-v="out"]{background:var(--minus)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.tabs{display:flex;gap:4px;padding:4px;background:#e9e7de;border-radius:12px;margin-bottom:14px}
.tabs button{flex:1;min-height:42px;border:0;border-radius:9px;background:none;font-weight:700;color:var(--muted)}
.tabs button.on{background:#fff;color:var(--brand-dark);box-shadow:var(--shadow)}
.toggle{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-weight:600;font-size:14px;cursor:pointer;user-select:none}
.toggle input{width:20px;height:20px;accent-color:var(--brand)}
.search{position:relative}
.search input{padding-left:38px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--faint);pointer-events:none}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:14px;margin-bottom:12px}
.banner.info{background:var(--brand-3);border:1px solid var(--brand-2)}
.banner.warn{background:var(--warn-bg);color:var(--warn);border:1px solid #f0e2b8}
.banner.lock{background:#eef0ee;border:1px solid #dcdfdb}
.banner b{display:block}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty p{margin:0 0 14px;font-size:15px}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}

/* avatar */
.av{flex:none;width:48px;height:48px;border-radius:12px;overflow:hidden;background:#d9dbd6;display:inline-flex;align-items:center;justify-content:center;border:0;padding:0}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.ph{border-radius:50%;background:#d7d9d4;color:#5c625b;font-weight:800;font-size:19px}
.av.sm{width:36px;height:36px;font-size:15px;border-radius:9px}
.av.sm.ph{border-radius:50%}
button.av{cursor:zoom-in}

/* ---------- count page ---------- */
.period{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.period h1{margin:0}
.tools{position:sticky;top:var(--top-h);z-index:10;background:var(--bg);padding:6px 0 10px;margin:0 0 4px}
.tools-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.prog{flex:1;min-width:180px}
.prog-txt{font-size:14px;font-weight:700;margin-bottom:4px}
.prog-txt .num{color:var(--brand-dark)}
.bar{height:8px;border-radius:99px;background:#e2e0d6;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .2s}
.grp{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow)}
.grp-head{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:10px 14px;border:0;background:var(--brand-3);text-align:left;font-weight:800;font-size:16px}
.grp-head .chev{transition:transform .15s;flex:none;width:18px;height:18px}
.grp-head[aria-expanded="true"] .chev{transform:rotate(90deg)}
.grp-head .gname{flex:1;min-width:0}
.grp-cnt{font-size:14px;color:var(--muted);font-weight:700}
.grp-cnt.done{color:var(--ok)}
.crow{padding:12px 14px;border-top:1px solid var(--line-2)}
.crow.counted{background:#fcfdfb}
.crow-head{display:flex;gap:10px;align-items:center}
.crow-name{flex:1;min-width:0}
.crow-name b{font-size:16px;word-break:keep-all}
.crow-name small{display:block;color:var(--muted);font-size:12.5px}
.state{font-size:12px;font-weight:700;white-space:nowrap;padding:2px 8px;border-radius:99px}
.state.on{background:var(--ok-bg);color:var(--ok)}
.state.off{background:var(--line-2);color:var(--faint)}
.crow-in{display:grid;grid-template-columns:1fr 1fr 1fr 1.1fr;gap:6px;margin-top:10px;align-items:end}
.crow-in label{display:flex;flex-direction:column;gap:2px;font-size:12px;font-weight:700;color:var(--muted);min-width:0}
.crow-in input{width:100%;min-height:46px;padding:6px 8px;border:1.5px solid var(--line);border-radius:10px;font-size:17px;text-align:right;font-variant-numeric:tabular-nums;background:#fff}
.crow-in input:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-2)}
.total{display:flex;flex-direction:column;gap:2px;font-size:12px;font-weight:700;color:var(--muted)}
.total output{display:flex;align-items:center;justify-content:flex-end;min-height:46px;padding:0 8px;border-radius:10px;background:var(--line-2);font-size:17px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.calc{margin-top:8px;font-size:12.5px;color:var(--muted);line-height:1.55;font-variant-numeric:tabular-nums}
.calc b{font-size:13px}
.reason{margin-top:8px}
.reason input{width:100%;min-height:42px;padding:6px 10px;border:1.5px dashed #d6d3c6;border-radius:10px;font-size:15px;background:#fff}
.bottom-bar{position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));z-index:20;display:flex;gap:8px;align-items:center;padding:10px 14px;background:rgba(255,255,255,.97);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.05)}
.save-state{flex:1;display:flex;align-items:center;gap:6px;min-height:44px;font-size:14px;font-weight:700;color:var(--ok)}
.save-state.saving{color:var(--muted)}
.save-state.err{color:var(--minus)}
.bottom-bar .btn{flex:none}
.page-count main,.has-bottom-bar main{padding-bottom:calc(var(--tab-h) + 96px + env(safe-area-inset-bottom))}
@media (min-width:900px){
  .bottom-bar{left:220px;bottom:0;padding:12px 28px}
  .has-bottom-bar main{padding-bottom:110px}
  .crow-in{grid-template-columns:repeat(3,minmax(90px,140px)) minmax(110px,160px);justify-content:start}
  .crow{display:grid;grid-template-columns:minmax(220px,1fr) auto;column-gap:16px;align-items:center}
  .crow-in{margin-top:0}
  .crow .calc,.crow .reason{grid-column:1/-1}
}

/* ---------- tables (responsive) ---------- */
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:14px}
.tbl th{background:var(--brand-3);color:var(--brand-dark);font-weight:800;font-size:13px;padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl th.n,.tbl td.n{text-align:right}
.tbl tr.cat-row td{background:#f7f6f1;font-weight:800;font-size:13px;color:var(--muted);padding:8px}
.tbl-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.name-cell{display:flex;align-items:center;gap:10px;min-width:0}
.name-cell b{word-break:keep-all}
.name-cell small{display:block;color:var(--muted);font-size:12px;font-weight:400}
@media (max-width:899px){
  .tbl.cards thead{display:none}
  .tbl.cards,.tbl.cards tbody,.tbl.cards tr,.tbl.cards td{display:block;width:100%}
  .tbl.cards tr{padding:10px 12px;border-bottom:1px solid var(--line)}
  .tbl.cards tr.cat-row{padding:0}
  .tbl.cards tr.cat-row td{justify-content:flex-start;text-align:left;padding:8px 12px}
  .tbl.cards td{border:0;padding:3px 0;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:right}
  .tbl.cards td::before{content:attr(data-label);font-size:12.5px;font-weight:700;color:var(--muted);text-align:left;flex:none}
  .tbl.cards td.first{display:block;text-align:left;padding-bottom:6px}
  .tbl.cards td.first::before{display:none}
  .tbl.cards td.n{justify-content:space-between}
  .tbl.cards td.hide-m{display:none}
}
.mini-in{width:84px;min-height:40px;padding:4px 8px;border:1.5px solid var(--line);border-radius:9px;text-align:right;font-variant-numeric:tabular-nums;font-size:15px;background:#fff}
.mini-in.wide{width:100%;min-width:120px;text-align:left}
.mini-in:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-2)}
.act-box{display:flex;align-items:center;gap:4px;justify-content:flex-end;flex-wrap:wrap}
.act-box label{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-weight:700}
.act-box .mini-in{width:66px}
.act-box output{min-width:64px;font-weight:800;text-align:right}
@media (min-width:900px){ .act-box{flex-wrap:nowrap} }
.tbl td.exp{background:#eef3fb;font-weight:800}
.tbl td.act{background:#fcf3ec}
@media (max-width:899px){ .tbl td.exp,.tbl td.act{background:none} }
.print-only{display:none}
@media (min-width:900px){ .m-only{display:none!important} }

/* ---------- movement ---------- */
.picker{position:relative}
.picker-btn{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:4px 12px 4px 6px;border:1.5px solid var(--line);border-radius:12px;background:#fff;text-align:left;font-size:16px}
.picker-btn .ph-txt{color:var(--faint)}
.picker-btn .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picker-pop{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:50;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.15);padding:8px}
.picker-list{max-height:300px;overflow:auto;margin-top:6px}
.picker-opt{display:flex;align-items:center;gap:10px;width:100%;min-height:50px;padding:4px 8px;border:0;border-radius:10px;background:none;text-align:left}
.picker-opt:hover,.picker-opt.active{background:var(--brand-3)}
.picker-opt small{display:block;color:var(--muted);font-size:12px}
.conv{font-size:15px;font-weight:700;color:var(--brand-dark);background:var(--brand-3);border-radius:10px;padding:10px 12px;font-variant-numeric:tabular-nums}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.filters .full{grid-column:1/-1}
@media (min-width:900px){ .filters{grid-template-columns:2fr 1fr 1fr auto} .filters .full{grid-column:auto} .form-grid.mov{grid-template-columns:160px 200px 1fr 140px 180px} .form-grid.mov .full{grid-column:auto} .form-grid.mov .wide{grid-column:1/-1} }
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav .btn{min-width:44px;padding:0}
.month-nav strong{font-size:18px;min-width:132px;text-align:center;font-variant-numeric:tabular-nums}
.sum-list{list-style:none;margin:0;padding:0}
.sum-list li{padding:10px 0;border-top:1px solid var(--line-2)}
.sum-list li:first-child{border-top:0}
.sum-line{font-size:13.5px;color:var(--muted);margin-top:4px;word-break:keep-all}
.mov-type{font-weight:800}
.mov-type.in{color:var(--plus)}
.mov-type.out{color:var(--minus)}

/* ---------- manage ---------- */
.list{list-style:none;margin:0;padding:0}
.li{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 10px;border-bottom:1px solid var(--line-2);background:#fff}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .grow small{display:block;color:var(--muted);font-size:12.5px}
.drag{flex:none;display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border:0;background:none;color:var(--faint);cursor:grab;touch-action:none;border-radius:8px}
.drag:active{cursor:grabbing}
.li.dragging{background:var(--brand-3);box-shadow:0 6px 18px rgba(0,0,0,.12);position:relative;z-index:2}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;border:0;background:none;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px;padding:0 8px}
.icon-btn:hover{background:var(--line-2);color:var(--ink)}
.icon-btn.danger{color:var(--minus)}
.add-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.add-row .fld{flex:1;min-width:180px}
.scope{display:flex;gap:8px;flex-wrap:wrap}
.scope label{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;background:#fff}
.scope input{accent-color:var(--brand);width:18px;height:18px}
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 8px;font-size:14px;font-weight:800;color:var(--muted)}

/* ---------- modal / toast ---------- */
.modal-back{position:fixed;inset:0;z-index:100;background:rgba(20,26,22,.45);display:flex;align-items:flex-end;justify-content:center}
.modal{width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.25);animation:up .18s ease-out}
.modal.wide{max-width:860px}
@media (min-width:640px){ .modal-back{align-items:center;padding:20px} .modal{border-radius:18px;animation:fade .15s ease-out} }
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ .modal{animation:none} .bar > i{transition:none} }
.modal-h{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line-2)}
.modal-h h3{flex:1;margin:0;font-size:17px}
.modal-b{padding:14px 16px;overflow:auto}
.modal-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line-2)}
.modal-f .btn{flex:1 1 auto}
@media (min-width:640px){ .modal-f .btn{flex:0 0 auto} }
.zoom-img{display:block;width:100%;max-height:70vh;object-fit:contain;border-radius:12px;background:#f0f0ec}

.photo-edit .av{width:96px;height:96px;border-radius:16px;font-size:36px}

.toast-root{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tab-h) + 86px + env(safe-area-inset-bottom));z-index:200;display:flex;flex-direction:column;gap:8px;width:min(92vw,460px);pointer-events:none}
@media (min-width:900px){ .toast-root{bottom:96px} }
.toast{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;background:#22302a;color:#fff;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:auto}
.toast.err{background:#8f2219}
.toast span{flex:1}
.toast button{border:0;background:rgba(255,255,255,.16);color:#fff;font-weight:800;min-height:36px;padding:0 12px;border-radius:9px}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}

.kv dd{margin:0}
.test-out{font:13px/1.6 ui-monospace,Menlo,Consolas,monospace;background:#f6f6f2;border-radius:10px;padding:10px;white-space:pre-wrap;margin-top:10px}

<script>
'use strict';

/* =====================================================================
 * 1. storage 모듈
 *    - 저장/불러오기는 모두 여기서만 한다.
 *    - 나중에 Supabase 등 서버 저장소로 바꿀 때 이 객체의 메서드
 *      (init, getAll, put, putMany, remove, exportAll, importAll, clearAll)
 *      만 같은 모양으로 다시 구현하면 된다.
 *    - IndexedDB를 못 쓰는 환경(일부 브라우저의 file:// 등)에서는
 *      localStorage로 자동 대체한다.
 * ===================================================================== */
const storage = (() => {
  const DB_NAME = 'inventory-survey';
  const VERSION = 1;
  const STORES = ['meta', 'categories', 'items', 'groups', 'movements', 'monthData', 'months', 'checkpoints'];
  let db = null;
  let mode = 'idb';
  const mem = {};

  const reqP = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const txDone = t => new Promise((res, rej) => { t.oncomplete = () => res(); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('aborted')); });

  function loadLocal() {
    STORES.forEach(s => {
      try { mem[s] = JSON.parse(localStorage.getItem('inv:' + s) || '{}'); } catch (e) { mem[s] = {}; }
    });
  }
  function persistLocal(s) {
    try { localStorage.setItem('inv:' + s, JSON.stringify(mem[s])); }
    catch (e) { throw new Error('저장 공간이 부족해요. 사진을 줄이거나 백업 후 정리해 주세요.'); }
  }

  async function init() {
    try {
      if (!window.indexedDB) throw new Error('IndexedDB 없음');
      db = await new Promise((res, rej) => {
        const r = indexedDB.open(DB_NAME, VERSION);
        r.onupgradeneeded = () => {
          const d = r.result;
          STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); });
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('blocked'));
      });
      mode = 'idb';
    } catch (e) {
      console.warn('IndexedDB를 쓸 수 없어 localStorage로 저장합니다.', e);
      mode = 'local';
      loadLocal();
    }
    return mode;
  }

  async function getAll(s) {
    if (mode === 'idb') return reqP(db.transaction(s, 'readonly').objectStore(s).getAll());
    return Object.values(mem[s] || {});
  }
  async function put(s, rec) {
    if (mode === 'idb') {
      const t = db.transaction(s, 'readwrite'); t.objectStore(s).put(rec); return txDone(t);
    }
    mem[s][rec.id] = JSON.parse(JSON.stringify(rec)); persistLocal(s);
  }
  async function putMany(s, recs) {
    if (mode === 'idb') {
      const t = db.transaction(s, 'readwrite'); const os = t.objectStore(s); recs.forEach(r => os.put(r)); return txDone(t);
    }
    recs.forEach(r => { mem[s][r.id] = JSON.parse(JSON.stringify(r)); }); persistLocal(s);
  }
  async function remove(s, id) {
    if (mode === 'idb') { const t = db.transaction(s, 'readwrite'); t.objectStore(s).delete(id); return txDone(t); }
    delete mem[s][id]; persistLocal(s);
  }
  async function clearAll() {
    if (mode === 'idb') {
      const t = db.transaction(STORES, 'readwrite'); STORES.forEach(s => t.objectStore(s).clear()); return txDone(t);
    }
    STORES.forEach(s => { mem[s] = {}; persistLocal(s); });
  }
  async function exportAll() {
    const out = { app: 'inventory-survey', version: 1, exportedAt: new Date().toISOString(), stores: {} };
    for (const s of STORES) out.stores[s] = await getAll(s);
    return out;
  }
  async function importAll(data) {
    if (!data || data.app !== 'inventory-survey' || !data.stores) throw new Error('이 앱의 백업 파일이 아니에요.');
    if (mode === 'idb') {
      const t = db.transaction(STORES, 'readwrite');
      STORES.forEach(s => { const os = t.objectStore(s); os.clear(); (data.stores[s] || []).forEach(r => os.put(r)); });
      return txDone(t);
    }
    STORES.forEach(s => { mem[s] = {}; (data.stores[s] || []).forEach(r => { mem[s][r.id] = r; }); persistLocal(s); });
  }
  return { STORES, init, getAll, put, putMany, remove, clearAll, exportAll, importAll, get mode() { return mode; } };
})();

/* =====================================================================
 * 2. 계산 규칙 (순수 함수) — 콘솔에서 Calc.selfTest() 로 확인
 * ===================================================================== */
const Calc = {
  round(n) { return Math.round((Number(n) || 0) * 1000) / 1000; },
  /** 실사 합계 = 박스 수량 × 1박스 기준 + 낱개 수량 */
  countTotal(box, boxQty, ea) { return Calc.round((Number(box) || 0) * (Number(boxQty) || 0) + (Number(ea) || 0)); },
  /** 예상 재고 = 전월 재고 + 반입 − 반출 − 판매(사용) */
  expected(prev, inQ, outQ, sales) { return Calc.round((Number(prev) || 0) + (Number(inQ) || 0) - (Number(outQ) || 0) - (Number(sales) || 0)); },
  /** 오차 = 실사 재고 − 예상 재고 */
  diff(actual, expected) { return Calc.round((Number(actual) || 0) - (Number(expected) || 0)); },
  /** 해당 월 1일 ~ upto(YYYY-MM-DD) 까지 반입·반출 누적 */
  sumMovements(movs, ym, upto) {
    let inQ = 0, outQ = 0;
    for (const m of movs) {
      if (m.date.slice(0, 7) !== ym) continue;
      if (upto && m.date > upto) continue;
      if (m.type === 'in') inQ += m.qty; else outQ += m.qty;
    }
    return { inQ: Calc.round(inQ), outQ: Calc.round(outQ) };
  },
  /** 현재 재고 = 가장 최근 실사 값 + 그 이후 반입 − 반출. 실사가 없으면 fallback(예상 재고) */
  currentStock(latest, movs, fallback) {
    if (!latest) return Calc.round(fallback);
    let v = latest.value;
    for (const m of movs) {
      const after = m.date > latest.date || (m.date === latest.date && (m.createdAt || 0) > latest.ts);
      if (after) v += m.type === 'in' ? m.qty : -m.qty;
    }
    return Calc.round(v);
  },
  /** 다음 달 전월 재고 = 이번 달 확정된 실사 재고 */
  nextPrev(confirmedActual) { return Calc.round(confirmedActual); },
  selfTest() {
    const cases = [
      ['예시 1: 전월 0, 판매 393, 반출 252 → 예상 −645', Calc.expected(0, 0, 252, 393), -645],
      ['예시 2: 실사 7857, 예상 −645 → 오차 8502', Calc.diff(7857, -645), 8502],
      ['실사 합계: 13.5박스 × 1400 + 0 = 18900', Calc.countTotal(13.5, 1400, 0), 18900],
      ['실사 합계: 1박스 × 100 + 41 = 141', Calc.countTotal(1, 100, 41), 141],
      ['상품3: 전월 0, 판매 630, 반출 288 → −918', Calc.expected(0, 0, 288, 630), -918],
      ['반입 2박스(1400ea) 반영: 0 + 2800 − 0 − 0 = 2800', Calc.expected(0, Calc.countTotal(2, 1400, 0), 0, 0), 2800],
      ['월 누적: 11월 반입 10, 반출 3 (12월분 제외)', JSON.stringify(Calc.sumMovements([
        { date: '2026-11-02', type: 'in', qty: 10 }, { date: '2026-11-05', type: 'out', qty: 3 }, { date: '2026-12-01', type: 'in', qty: 99 }], '2026-11', '2026-11-30')), JSON.stringify({ inQ: 10, outQ: 3 })],
      ['현재 재고: 실사 100 이후 반출 30 → 70', Calc.currentStock({ value: 100, date: '2026-11-05', ts: 5 },
        [{ date: '2026-11-04', type: 'in', qty: 50, createdAt: 1 }, { date: '2026-11-06', type: 'out', qty: 30, createdAt: 9 }], 0), 70],
      ['다음 달 전월 재고 = 확정 실사 7857', Calc.nextPrev(7857), 7857],
    ];
    let pass = 0;
    const lines = cases.map(([name, got, want]) => { const ok = got === want; if (ok) pass++; return `${ok ? '✅' : '❌'} ${name}  (결과: ${got})`; });
    const summary = `계산 자체 테스트: ${pass}/${cases.length} 통과`;
    console.log([summary, ...lines].join('\n'));
    return { pass, total: cases.length, ok: pass === cases.length, lines, summary };
  }
};
window.Calc = Calc;

/* =====================================================================
 * 3. 유틸
 * ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
function todayStr() { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function curYm() { return todayStr().slice(0, 7); }
function addMonth(ym, n) { let [y, m] = ym.split('-').map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; }
function monthEnd(ym) { const [y, m] = ym.split('-').map(Number); return `${ym}-${pad(new Date(y, m, 0).getDate())}`; }
function ymLabel(ym) { const [y, m] = ym.split('-').map(Number); return `${y}년 ${m}월`; }
function mLabel(ym) { return `${Number(ym.split('-')[1])}월`; }
function dShort(d) { const [, m, dd] = d.split('-').map(Number); return `${m}.${dd}`; }
function dKo(d) { const [, m, dd] = d.split('-').map(Number); return `${m}월 ${dd}일`; }
function fmt(n) { if (n === null || n === undefined || n === '') return '–'; const v = Calc.round(n); return v.toLocaleString('ko-KR', { maximumFractionDigits: 3 }).replace('-', '−'); }
function fmtS(n) { if (n === null || n === undefined) return '–'; return n > 0 ? '+' + fmt(n) : fmt(n); }
function plain(n) { return n === null || n === undefined ? '' : String(Calc.round(n)); }
function parseNum(str, allowNeg) {
  const s = String(str ?? '').replace(/[,\s]/g, '');
  if (s === '') return null;
  const re = allowNeg ? /^-?\d*\.?\d*$/ : /^\d*\.?\d*$/;
  if (!re.test(s) || s === '.' || s === '-') return undefined;
  return Number(s);
}
function daysAgo(ts) { return Math.floor((Date.now() - ts) / 86400000); }
function fmtDateTime(ts) { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }

const CHO = ['ㄱ', 'ㄲ', 'ㄴ', 'ㄷ', 'ㄸ', 'ㄹ', 'ㅁ', 'ㅂ', 'ㅃ', 'ㅅ', 'ㅆ', 'ㅇ', 'ㅈ', 'ㅉ', 'ㅊ', 'ㅋ', 'ㅌ', 'ㅍ', 'ㅎ'];
function chosung(s) { return [...s].map(c => { const k = c.charCodeAt(0) - 0xAC00; return k >= 0 && k < 11172 ? CHO[Math.floor(k / 588)] : c; }).join(''); }
const norm = s => String(s || '').toLowerCase().replace(/\s+/g, '');
function matchQ(name, q) { q = norm(q); if (!q) return true; const n = norm(name); return n.includes(q) || chosung(n).includes(q); }

const ICON = {
  count: '<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/>',
  mov: '<path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/>',
  inv: '<path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/>',
  month: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/><path d="m9 16 2 2 4-4"/>',
  manage: '<path d="M8 6h13M8 12h13M8 18h13"/><path d="M3 6h.01M3 12h.01M3 18h.01"/>',
  settings: '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5"/><path d="M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  chev: '<path d="m9 18 6-6-6-6"/>',
  grip: '<circle cx="9" cy="6" r="1"/><circle cx="15" cy="6" r="1"/><circle cx="9" cy="12" r="1"/><circle cx="15" cy="12" r="1"/><circle cx="9" cy="18" r="1"/><circle cx="15" cy="18" r="1"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
};
const svg = (k, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

/* =====================================================================
 * 4. 데이터 캐시 (화면은 이 메모리 캐시를 읽고, 쓰기는 storage로 바로 저장)
 * ===================================================================== */
const DB = {};
let saveListeners = [];
const SaveState = { state: 'saved', at: null };
function setSaveState(st) { SaveState.state = st; if (st === 'saved') SaveState.at = Date.now(); saveListeners.forEach(f => f()); }
async function loadAll() { for (const s of storage.STORES) { const rows = await storage.getAll(s); DB[s] = new Map(rows.map(r => [r.id, r])); } }
function save(store, rec) {
  DB[store].set(rec.id, rec);
  setSaveState('saving');
  return storage.put(store, rec).then(() => setSaveState('saved')).catch(e => { setSaveState('err'); toast('저장하지 못했어요: ' + e.message, { error: true }); });
}
function saveMany(store, recs) {
  recs.forEach(r => DB[store].set(r.id, r));
  setSaveState('saving');
  return storage.putMany(store, recs).then(() => setSaveState('saved')).catch(e => { setSaveState('err'); toast('저장하지 못했어요: ' + e.message, { error: true }); });
}
function del(store, id) { DB[store].delete(id); return storage.remove(store, id).catch(e => toast('삭제하지 못했어요: ' + e.message, { error: true })); }
const meta = { get(k, d) { const r = DB.meta.get(k); return r ? r.value : d; }, set(k, v) { return save('meta', { id: k, value: v }); } };

/* ---------- 도메인 헬퍼 ---------- */
const SHOPS = {
  gift: { name: '기념품숍', icon: '🛍', color: '#2f6b45', sales: '판매', salesLong: '이번 달 누적 판매 수량' },
  exp: { name: '체험장', icon: '🌱', color: '#c0570f', sales: '체험 사용', salesLong: '이번 달 누적 체험 사용 수량' },
};
const S = {
  shop: 'gift', page: 'count',
  countQ: '', onlyEmpty: false, collapsed: new Set(),
  invCat: 'all', invQ: '', invLow: false,
  monthYm: curYm(), movYm: curYm(), movFilter: { item: '', type: '', date: '' },
  mgTab: 'cat', showArchived: false,
  countDirty: false, noticeHidden: false,
};
const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0) || (a.createdAt || 0) - (b.createdAt || 0);
function catOf(item) { return DB.categories.get(item.categoryId); }
function shopOf(item) { const c = catOf(item); return c ? c.shop : 'gift'; }
function isCommon(item) { return shopOf(item) === 'common'; }
function catsFor(shop) {
  const all = [...DB.categories.values()].filter(c => c.shop === shop || c.shop === 'common');
  return all.sort((a, b) => (a.shop === 'common') - (b.shop === 'common') || byOrder(a, b));
}
function itemsFor(shop, opts = {}) {
  const cats = catsFor(shop); const ci = new Map(cats.map((c, i) => [c.id, i]));
  return [...DB.items.values()]
    .filter(it => ci.has(it.categoryId) && (opts.archived ? true : !it.archived))
    .sort((a, b) => ci.get(a.categoryId) - ci.get(b.categoryId) || byOrder(a, b));
}
function movsOf(itemId) { return [...DB.movements.values()].filter(m => m.itemId === itemId); }

function openModal({ title, body, actions = [], wide = false, onMount, dismissable = true }) {
  return new Promise(resolve => {
    const prevFocus = document.activeElement;
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="modal-h"><h3>${esc(title)}</h3>${dismissable ? `<button class="icon-btn" data-close aria-label="닫기">${svg('x')}</button>` : ''}</div>
      <div class="modal-b">${body}</div>
      ${actions.length ? `<div class="modal-f">${actions.map((a, i) => `<button type="button" class="btn ${a.cls || ''}" data-i="${i}">${esc(a.label)}</button>`).join('')}</div>` : ''}
    </div>`;
    $('#modalRoot').appendChild(back);
    const el = $('.modal', back);
    let done = false;
    const close = v => { if (done) return; done = true; back.remove(); document.removeEventListener('keydown', onKey, true); if (prevFocus && prevFocus.focus) prevFocus.focus(); resolve(v); };
    const onKey = e => {
      if (e.key === 'Escape' && dismissable) { e.preventDefault(); close(null); }
      if (e.key === 'Tab') {
        const f = $$('button,input,select,textarea,[tabindex]:not([tabindex="-1"])', el).filter(x => !x.disabled && x.offsetParent !== null);
        if (!f.length) return;
        if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
      }
    };
    document.addEventListener('keydown', onKey, true);
    back.addEventListener('click', e => { if (e.target === back && dismissable) close(null); });
    $$('[data-close]', el).forEach(b => b.addEventListener('click', () => close(null)));
    const ctx = { el, close };
    $$('.modal-f [data-i]', el).forEach(b => b.addEventListener('click', async () => {
      const a = actions[+b.dataset.i];
      if (a.onClick) { const r = await a.onClick(ctx); if (r === false) return; close(r === undefined ? a.value : r); }
      else close(a.value);
    }));
    if (onMount) onMount(ctx);
    const first = $('input:not([type=hidden]):not([disabled]),select,textarea', $('.modal-b', el)) || $('.modal-f .btn.primary,.modal-f .btn.danger', el) || el;
    setTimeout(() => first.focus && first.focus(), 30);
  });
}
function confirmDialog({ title, message, ok, danger = false, cancel = '취소' }) {
  return openModal({ title, body: `<div style="font-size:15px">${message}</div>`,
    actions: [{ label: cancel, value: false }, { label: ok, value: true, cls: danger ? 'danger solid' : 'primary' }] }).then(v => !!v);
}
function toast(msg, opts = {}) {
  const t = document.createElement('div');
  t.className = 'toast' + (opts.error ? ' err' : '');
  t.innerHTML = `<span>${esc(msg)}</span>${opts.undo ? '<button type="button">되돌리기</button>' : ''}`;
  const root = $('#toastRoot'); while (root.children.length >= 2) root.firstElementChild.remove();
  root.appendChild(t);
  const timer = setTimeout(() => t.remove(), opts.undo ? 5000 : 2800);
  if (opts.undo) $('button', t).addEventListener('click', () => { clearTimeout(timer); t.remove(); opts.undo(); });
}
function zoomItem(item) {

  const used = new Set(); const out = [];
  [...DB.groups.values()].filter(g => g.shop === shop).sort(byOrder).forEach(g => {
    const its = g.itemIds.filter(id => visible.has(id) && !used.has(id)).map(id => DB.items.get(id));
    its.forEach(i => used.add(i.id));
    if (its.length) out.push({ key: 'g:' + g.id, name: g.name, items: its, kind: '묶음' });

function parsePaste(text, items) {
  const byName = new Map(items.map(i => [norm(i.name), i]));
  const matched = [], unmatched = [];
  text.split(/\r?\n/).forEach(line => {
    if (!line.trim()) return;
    let cols = line.split('\t').map(s => s.trim()).filter(Boolean);
    if (cols.length < 2) { const m = line.trim().match(/^(.*?)[\s,;]+([-\d.,]+)\s*$/); cols = m ? [m[1], m[2]] : [line.trim()]; }
    const name = cols[0]; const qty = parseNum(cols[cols.length - 1]);
    const it = byName.get(norm(name));
    if (cols.length < 2 || qty === undefined || qty === null) unmatched.push({ line, why: '수량을 읽지 못함' });
    else if (!it) unmatched.push({ line, why: '같은 이름의 품목 없음' });
    else matched.push({ item: it, qty });
  });
  return { matched, unmatched };
}

  }

  function paintSeg() {
    $$('[data-seg=type] button', root).forEach(b => { const on = b.dataset.v === st.type; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
    $$('[data-seg=unit] button', root).forEach(b => { const on = b.dataset.v === st.unit; b.classList.toggle('on', on); b.setAttribute('aria-checked', on); });
    const it = DB.items.get(st.itemId);

    if (!it || !v) { conv.hidden = true; return; }
    conv.hidden = false;

    conv.innerHTML = st.unit === 'box' ? `${fmt(v)}박스 = <b>${fmt(v * it.boxQty)}${u}</b> 로 저장돼요 (1박스 ${fmt(it.boxQty)}${u})` : `낱개 <b>${fmt(v)}${u}</b> 로 저장돼요`;
  }

  q.addEventListener('input', paintList);

  $$('.seg', root).forEach(seg => seg.addEventListener('click', e => { const b = e.target.closest('button'); if (!b || b.disabled) return; st[seg.dataset.seg] = b.dataset.v; paintSeg(); }));

  paintBtn(); paintSeg();
  return {
    st,
    isDirty() { return root.isConnected && JSON.stringify({ ...st, qty: qty.value, memo: $('[name=memo]', root).value }) !== initial && (!!st.itemId || !!qty.value || !!$('[name=memo]', root).value); },
    read() {

    },
  };

function monthItems(shop, ym) {

  return itemsFor(shop, { archived: true }).filter(i => {
    const m = md(ym, i.id);
    if (isConfirmed(shop, ym)) return !!(m && m.snap);
    if (isLocked(i, ym)) return !!(m && m.snap);
    return !i.archived || !!m || movsOf(i.id).some(x => x.date.slice(0, 7) === ym);
  });
}

    ${firstMonthBanner}

function refreshMonthSummary() {
  const box = $('#monthSummary'); if (!box) return;

    ${unc.length && unc.length < items.length ? `<p class="small muted" style="margin:6px 0 0">미입력: ${unc.map(x => esc(x.i.name)).join(', ')}</p>` : ''}`;

async function confirmMonth() {
  const ym = S.monthYm, shop = S.shop; const items = monthItems(shop, ym);
  const unc = items.filter(i => !monthCalc(i, ym).counted);
  const ok = await confirmDialog({ title: `${SHOPS[shop].name} ${ymLabel(ym)} 월말 확정`, ok: '월말 확정',
    message: `<p style="margin-top:0"><b>${mLabel(ym)} 재고를 확정하면 ${mLabel(addMonth(ym, 1))} 전월 재고로 자동 입력됩니다.</b></p>
      <dl class="kv"><dt>대상</dt><dd>${SHOPS[shop].name} · 품목 ${items.length}개</dd><dt>작성자</dt><dd>${esc(monthRec(shop, ym)?.author || '(비어 있음)')}</dd></dl>
      ${unc.length ? `<div class="banner warn" style="margin:10px 0 0"><div><b>실사 미입력 ${unc.length}개</b>는 예상 재고 값으로 확정돼요: ${unc.slice(0, 6).map(i => esc(i.name)).join(', ')}${unc.length > 6 ? ' 외' : ''}</div></div>` : ''}
      <p class="small muted">확정 후에는 이 달의 실사·${esc(salesLabel())}·반출입을 고칠 수 없어요(확정 해제로 다시 열 수 있음).</p>` });
  if (!ok) return;
  const recs = [];
  items.forEach(i => {
    const m = ensureMd(ym, i.id);
    if (m.snap) return; // 공용 품목이 이미 다른 매장에서 확정된 경우 그대로 둔다
    const c = monthCalc(i, ym);
    const actual = c.counted ? c.actual : c.expected;
    m.snap = { prev: c.prev, inQ: c.inQ, outQ: c.outQ, sales: c.sales, salesSet: true, expected: c.expected, actual, diff: Calc.diff(actual, c.expected), counted: c.counted, countedShop: c.countedShop };
    m.final = Calc.nextPrev(actual); m.snapBy = shop;
    recs.push(m);
  });
  await saveMany('monthData', recs);
  const r = monthRec(shop, ym) || { id: shop + '|' + ym, shop, ym };
  Object.assign(r, { confirmed: true, confirmedAt: Date.now(), author: ($('#author')?.value || r.author || '').trim() });
  await save('months', r);
  toast(`${mLabel(ym)} 재고를 확정했어요. ${mLabel(addMonth(ym, 1))} 전월 재고로 들어갔어요.`);
  render();
}
async function unconfirmMonth() {

  const s1 = await confirmDialog({ title: `${ymLabel(ym)} 확정 해제 (1/2)`, ok: '다음 단계', danger: true,
    message: `<b>${SHOPS[shop].name} ${mLabel(ym)}</b> 확정을 해제하면 이 달을 다시 고칠 수 있고, ${mLabel(addMonth(ym, 1))} 전월 재고 자동 입력도 풀려요.` });

function enableDragSort(listEl, onDone) {
  const items = () => $$(':scope > [data-id]', listEl);
  listEl.addEventListener('pointerdown', e => {
    const handle = e.target.closest('.drag'); if (!handle || !listEl.contains(handle)) return;
    const row = handle.closest('[data-id]'); if (!row || row.parentElement !== listEl) return;
    e.preventDefault(); row.classList.add('dragging'); handle.setPointerCapture(e.pointerId);
    const move = ev => {
      const y = ev.clientY; let before = null;
      for (const s of items()) { if (s === row) continue; const r = s.getBoundingClientRect(); if (y < r.top + r.height / 2) { before = s; break; } }
      if (before) { if (before !== row.nextElementSibling) listEl.insertBefore(row, before); } else if (listEl.lastElementChild !== row) listEl.appendChild(row);
    };
    const up = () => { handle.removeEventListener('pointermove', move); handle.removeEventListener('pointerup', up); handle.removeEventListener('pointercancel', up); row.classList.remove('dragging'); onDone(items().map(x => x.dataset.id)); };
    handle.addEventListener('pointermove', move); handle.addEventListener('pointerup', up); handle.addEventListener('pointercancel', up);
  });
  listEl.addEventListener('keydown', e => {
    const handle = e.target.closest('.drag'); if (!handle || (e.key !== 'ArrowUp' && e.key !== 'ArrowDown')) return;
    const row = handle.closest('[data-id]'); e.preventDefault();
    if (e.key === 'ArrowUp' && row.previousElementSibling) listEl.insertBefore(row, row.previousElementSibling);
    else if (e.key === 'ArrowDown' && row.nextElementSibling) listEl.insertBefore(row.nextElementSibling, row);
    handle.focus(); onDone(items().map(x => x.dataset.id));
  });
}

  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();

      const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));

      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);

    img.src = url;

 * 15. 시작
 * ===================================================================== */
(async function start() {
  try {
    await storage.init();
    await loadAll();
  } catch (e) {
    $('#main').innerHTML = `<div class="empty card"><strong>데이터를 열지 못했어요</strong><p>${esc(e.message)}</p><p>브라우저를 새로 고치거나, 다른 브라우저(크롬·사파리)로 열어 보세요.</p></div>`;
    return;
  }
  S.shop = meta.get('lastShop', 'gift') in SHOPS ? meta.get('lastShop', 'gift') : 'gift';
  const h = location.hash.slice(1); if (PAGES.some(p => p.id === h)) S.page = h;
  const t = Calc.selfTest(); if (!t.ok) console.error('계산 자체 테스트 실패');
  if (!meta.get('initializedAt', null)) { renderShell(); $('#main').innerHTML = ''; await firstRun(); }
  else render();
})();
</script>
